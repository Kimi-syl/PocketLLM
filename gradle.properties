org.gradle.jvmargs=-Xmx2300m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# aapt2 is selected by build-native.sh: the dev container needs an ARM-built
# aapt2 (/opt/aapt2arm), while a CI runner must use its own SDK's copy. A
# hardcoded android.aapt2FromMavenOverride here breaks the runner with
# "Specified AAPT2 executable does not exist".
