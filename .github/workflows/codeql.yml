name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          # First-party languages that exist in tracked code:
          #   java-kotlin  44 .kt (app, core, cli)   - no .java tracked
          #   swift        6 .swift
          #   c-cpp        llama_jni.cpp, *_shim.c
          #   python       gen_opencl_shim.py
          #   actions      .github/workflows
          # .ts/.js/.cs only exist inside the untracked llama.cpp checkout,
          # so there is deliberately no job for them.
          #
          # build-mode none: llama.cpp is gitignored, so a real native build
          # cannot run in CI; source-only extraction still covers our .kt/.swift/.c/.cpp.
          # Swift is the exception - it needs a real build (xcodebuild), so it
          # gets build-mode manual with an explicit build step below.
          - language: java-kotlin
            runs-on: ubuntu-latest
          - language: swift
            runs-on: macos-14
            build-mode: manual
          - language: c-cpp
            runs-on: ubuntu-latest
          - language: python
            runs-on: ubuntu-latest
          - language: actions
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.language == 'swift' && 90 || 30 }}

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Swift needs a real build for CodeQL to trace. The iOS app links against
      # a llama static archive; build it the same way ios.yml does. CodeQL only
      # needs the compile phase, so a link failure still yields extraction.
      - if: matrix.language == 'swift'
        name: Build llama static archive for Swift tracing
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp ci-llama
          git -C ci-llama checkout f280b26983ad0fdb705a0d9ebf0503e76f2899b0
          cmake -S ci-llama -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF \
            -DGGML_METAL=OFF -DLLAMA_CURL=OFF
          cmake --build build-ios --target llama ggml ggml-base ggml-cpu -j3
          mkdir -p ios-app/llama-libs ios-app/llama-headers
          libtool -static -o ios-app/llama-libs/libpocketllm_ios.a $(find build-ios -name "*.a" | sort)
          cp ci-llama/include/llama.h ios-app/llama-headers/
          cp ci-llama/ggml/include/*.h ios-app/llama-headers/
          find build-ios -name "ggml-version.h" -exec cp {} ios-app/llama-headers/ \; || true

      - if: matrix.language == 'swift'
        name: Build iOS app (Swift tracing)
        run: |
          set -e
          cd ios-app
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PocketLLM.xcodeproj -scheme PocketLLM \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
