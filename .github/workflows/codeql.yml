name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default setup scanned python+csharp (vendored SPIR-V headers) and
          # skipped Kotlin/Swift/C - the actual app. This matrix is the set of
          # languages that exist in tracked first-party code:
          #   java-kotlin  44 .kt (app, core, cli)   - no .java tracked
          #   swift        6 .swift
          #   c-cpp        llama_jni.cpp, *_shim.c
          #   python       gen_opencl_shim.py
          #   actions      .github/workflows
          # .ts/.js/.cs only exist inside the untracked llama.cpp checkout,
          # so there is deliberately no job for them.
          #
          # build-mode none: llama.cpp is gitignored, so a real native build
          # cannot run in CI; source-only extraction still covers our .kt/.swift/.c/.cpp
          - language: java-kotlin
            runs-on: ubuntu-latest
          - language: swift
            runs-on: macos-14
          - language: c-cpp
            runs-on: ubuntu-latest
          - language: python
            runs-on: ubuntu-latest
          - language: actions
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
