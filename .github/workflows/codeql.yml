name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          # First-party languages in tracked code. GitHub default setup scanned
          # python+csharp (from vendored SPIR-V headers) and skipped the app.
          # This matrix covers the real product:
          #   java-kotlin  44 .kt across app, core, cli   (no .java tracked)
          #   c-cpp        llama_jni.cpp, opencl_shim.c, vulkan_shim.c
          #   python       gen_opencl_shim.py
          #   actions      .github/workflows
          # .ts/.js/.cs exist only inside the untracked llama.cpp checkout, so
          # there is deliberately no job for them.
          #
          # build-mode none = source-only extraction. This is the mode that
          # works without a build: the Android Gradle / native CMake builds
          # need SDKs that are not set up on the runner, and autobuild fails on
          # the AAR resource transforms. Source-only still indexes every .kt,
          # .cpp, .c, .py and .yml file for the security-extended queries.
          - language: java-kotlin
            runs-on: ubuntu-latest
          - language: c-cpp
            runs-on: ubuntu-latest
          - language: python
            runs-on: ubuntu-latest
          - language: actions
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
