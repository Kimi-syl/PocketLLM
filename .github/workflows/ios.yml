name: ios

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build PocketLLMKit XCFramework
        run: ./gradlew :core:assemblePocketLLMKitXCFramework -PenableIos=true -PskipAndroid=true --no-daemon

      - name: Copy framework into the app
        run: |
          mkdir -p ios-app/Frameworks
          cp -R core/build/XCFrameworks/Release/PocketLLMKit.xcframework ios-app/Frameworks/

      - name: Build llama.cpp for iOS (simulator + device)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp ci-llama
          COMMON="-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake -S ci-llama -B build-ios-sim $COMMON \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          cmake --build build-ios-sim --target llama ggml ggml-base ggml-cpu -j
          cmake -S ci-llama -B build-ios-dev $COMMON \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          cmake --build build-ios-dev --target llama ggml ggml-base ggml-cpu -j
          mkdir -p ios-app/llama-libs ios-app/llama-headers
          libtool -static -o ios-app/llama-libs/libpocketllm_ios_sim.a $(find build-ios-sim -name "*.a" | sort)
          libtool -static -o ios-app/llama-libs/libpocketllm_ios_dev.a $(find build-ios-dev -name "*.a" | sort)
          cp ci-llama/include/llama.h ios-app/llama-headers/
          cp ci-llama/ggml/include/*.h ios-app/llama-headers/
          find build-ios-sim -name "ggml-version.h" -exec cp {} ios-app/llama-headers/ \; || true
          ls -la ios-app/llama-libs ios-app/llama-headers

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios-app && xcodegen generate

      - name: Build iOS app (simulator)
        run: |
          cd ios-app
          xcodebuild -project PocketLLM.xcodeproj -scheme PocketLLM \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLMKit.xcframework
          path: ios-app/Frameworks/PocketLLMKit.xcframework
