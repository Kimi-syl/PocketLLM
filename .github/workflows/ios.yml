name: ios

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is wasted compute; cancel it rather than let
# two full builds race for the same caches.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned once here so the cache keys, the clone and both cmake builds cannot
  # drift apart. Bumping this invalidates every llama.cpp cache entry at once,
  # which is the intent: a new commit means new objects.
  LLAMA_COMMIT: f280b26983ad0fdb705a0d9ebf0503e76f2899b0
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  ios:
    runs-on: macos-14
    # MLX and its Metal shaders add enough compile time to both app builds that
    # 40 minutes stopped being comfortable headroom.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ---------------------------------------------------------------- caches
      #
      # Restore and save are separate steps, rather than one actions/cache step.
      # The combined action declares `post-if: success()`, so it saves nothing
      # when a job fails — and while a workflow is being developed most runs
      # fail. A failed run therefore paid the full cold cost and persisted none
      # of it, leaving every cache empty and the next run just as slow. That was
      # measured: the first run of this workflow had all four caches miss, and
      # failed at the Swift compile, so all four were discarded.
      #
      # Splitting them lets each save run under `if: always()`, banking finished
      # work whether or not the app compiled. `continue-on-error` covers a re-run
      # of the same commit, where the key already exists and the save action
      # reports that as an error.
      #
      # Keys are unique to the runner OS, and the llama.cpp entries carry the
      # pinned commit, so a restored tree can only hold objects built from the
      # commit whose headers they were compiled against.

      # The Gradle restore is listed before the llama.cpp one, and that ordering
      # matters: `hashFiles` sees the workspace as it is at that moment, and the
      # llama.cpp restore brings a vendored examples/llama.android tree carrying
      # its own .gradle files. Hashing before that lands keeps the key identical
      # on a cold run and on every warm one. The globs are rooted at this
      # project's own module depth for the same reason — see the comment below.
      - name: Restore Gradle and Kotlin/Native
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle*', '*/build.gradle*', 'gradle/**', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # llama.cpp source plus both CMake trees.
      - name: Restore llama.cpp source and cmake builds
        uses: actions/cache/restore@v4
        with:
          path: |
            ci-llama
            build-ios-sim
            build-ios-dev
          key: ${{ runner.os }}-llama-${{ env.LLAMA_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-llama-

      # Gradle: dependency cache, wrapper, and the Kotlin/Native toolchain that
      # konan downloads. The restore-key fallback (no trailing hash) keeps the
      # expensive ~/.konan toolchain reusable when only the project changes —
      # that download alone is several minutes.
      #
      # The glob must not be `**/*.gradle*`. The llama.cpp checkout contains
      # examples/llama.android/build.gradle.kts and its own
      # gradle-wrapper.properties; hashing those would make the key depend on
      # whether the llama.cpp cache had been restored, so the first run would
      # compute one key and every later run another, and the Gradle cache could
      # never hit. Rooting the patterns at this repo's own module depth avoids
      # the vendored tree entirely.

      # Xcode DerivedData for both configurations. This also carries
      # ios-app/build/SourcePackages, so Swift package resolution (MLX,
      # swift-transformers, MarkdownUI) is reused instead of being re-checked-out
      # and re-compiled every push.
      #
      # Keyed on the Swift sources and the project manifest, so an exact-key hit
      # cannot serve a stale incremental build; the restore-key fallback allows a
      # previous-commit tree so the Swift compiler rebuilds only what changed.
      # Xcode's build database records what succeeded, so a tree left by a failed
      # compile is safe to reuse: unaffected objects are kept and the broken ones
      # are redone, exactly as a local incremental build behaves.
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            ios-app/build
            ios-app/build-device
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('ios-app/PocketLLM/**/*.swift', 'ios-app/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # Homebrew bottles/downloads for the only formula this job installs.
      - name: Restore Homebrew downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-

      # ----------------------------------------------------------------- build

      - name: Build PocketLLMKit XCFramework
        run: ./gradlew :core:assemblePocketLLMKitXCFramework -PenableIos=true -PskipAndroid=true --no-daemon

      - name: Copy framework into the app
        run: |
          mkdir -p ios-app/Frameworks
          cp -R core/build/XCFrameworks/Release/PocketLLMKit.xcframework ios-app/Frameworks/

      - name: Build llama.cpp for iOS (simulator)
        run: |
          # Clone only when the cache missed; a restored checkout is already at
          # the pinned commit.
          if [ ! -d ci-llama/.git ]; then
            git clone https://github.com/ggml-org/llama.cpp ci-llama
            git -C ci-llama checkout "$LLAMA_COMMIT"
          fi

          # CMake is incremental: on a cache hit the configure step reuses the
          # existing tree and `--build` compiles nothing.
          cmake -S ci-llama -B build-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF \
            -DGGML_METAL=OFF -DLLAMA_CURL=OFF
          cmake --build build-ios-sim --target llama ggml ggml-base ggml-cpu -j3

          mkdir -p ios-app/llama-libs ios-app/llama-headers
          libtool -static -o ios-app/llama-libs/libpocketllm_ios.a $(find build-ios-sim -name "*.a" | sort)
          cp ci-llama/include/llama.h ios-app/llama-headers/
          cp ci-llama/ggml/include/*.h ios-app/llama-headers/
          find build-ios-sim -name "ggml-version.h" -exec cp {} ios-app/llama-headers/ \; || true

      - name: Generate Xcode project
        run: |
          # brew is a no-op when the formula is already present (cached bottles).
          brew install xcodegen
          cd ios-app && xcodegen generate

      # NOTE: xcode-version stays latest-stable deliberately — the iOS artifact
      # is a simulator-only developer build (not a release), and hard-pinning a
      # major version eventually breaks CI when GitHub prunes runner images.
      - name: Build iOS app (simulator)
        run: |
          cd ios-app
          xcodebuild -project PocketLLM.xcodeproj -scheme PocketLLM \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLMKit.xcframework
          path: ios-app/Frameworks/PocketLLMKit.xcframework

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLM-simulator.app
          path: ios-app/build/Build/Products/Debug-iphonesimulator/PocketLLM.app
          if-no-files-found: error

      - name: Build llama.cpp for iOS (device, arm64)
        run: |
          # Device slice of the pinned llama.cpp, with the Metal backend.
          #
          # GGML_METAL_EMBED_LIBRARY folds the shader source into the static
          # library and compiles it at runtime. That is the only workable mode
          # here: the alternative shells out to `xcrun -sdk macosx metal` (wrong
          # SDK for an iOS cross-build) and expects a default.metallib sitting in
          # the app bundle, which a libtool-merged .a cannot provide.
          cmake -S ci-llama -B build-ios-dev \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DLLAMA_CURL=OFF
          cmake --build build-ios-dev --target llama ggml ggml-base ggml-cpu ggml-metal -j3

          mkdir -p ios-app/llama-libs-device
          libtool -static -o ios-app/llama-libs-device/libpocketllm_ios.a $(find build-ios-dev -name "*.a" | sort)

      - name: Build iOS app (device, unsigned)
        run: |
          cd ios-app
          # Unsigned on purpose: free-Apple-ID re-signing (Sideloadly/AltStore)
          # rejects binaries carrying a different signature, and CI has no
          # signing identity. LIBRARY_SEARCH_PATHS overrides the project value
          # so the linker picks the device .a instead of the simulator one.
          xcodebuild -project PocketLLM.xcodeproj -scheme PocketLLM \
            -destination "generic/platform=iOS" \
            -configuration Release -derivedDataPath build-device \
            build CODE_SIGNING_ALLOWED=NO \
            LIBRARY_SEARCH_PATHS="\$(SRCROOT)/llama-libs-device"

      - name: Package unsigned .ipa
        run: |
          cd ios-app/build-device/Build/Products/Release-iphoneos
          rm -rf Payload
          mkdir Payload && cp -R PocketLLM.app Payload/
          zip -qry PocketLLM-unsigned.ipa Payload

      - name: Upload device .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLM-device-unsigned
          path: ios-app/build-device/Build/Products/Release-iphoneos/PocketLLM-unsigned.ipa
          if-no-files-found: error

      # ------------------------------------------------------------------ save
      # Always: that is the whole point of splitting restore from save above.
      # Everything here is finished work the next run should not repeat, whether
      # or not the app compiled.

      - name: Save llama.cpp source and cmake builds
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ci-llama
            build-ios-sim
            build-ios-dev
          key: ${{ runner.os }}-llama-${{ env.LLAMA_COMMIT }}

      - name: Save Gradle and Kotlin/Native
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle*', '*/build.gradle*', 'gradle/**', 'gradle.properties') }}

      - name: Save Xcode DerivedData
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ios-app/build
            ios-app/build-device
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('ios-app/PocketLLM/**/*.swift', 'ios-app/project.yml') }}

      - name: Save Homebrew downloads
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
