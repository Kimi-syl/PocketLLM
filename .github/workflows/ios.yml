name: ios

# Only build iOS when something it actually consumes changes. It was running on
# every push to main including Android-only work, which is wasted compute.
on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - "core/**"
      - "app/src/main/cpp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - "core/**"
      - "app/src/main/cpp/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    # Defaults keep every push on the pinned GA image. A manual dispatch can run
    # the same build on the `xcode-27` preview image (macOS 27, Xcode 27) to see
    # what a newer SDK changes before it becomes the default.
    inputs:
      runner:
        description: "Runner image label"
        default: "macos-26"
      xcode:
        description: "Xcode major version"
        default: "26"

# A superseded run on the same ref is wasted compute; cancel it rather than let
# two full builds race for the same caches.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned once here so the cache keys, the clone and both cmake builds cannot
  # drift apart. Bumping this invalidates every llama.cpp cache entry at once,
  # which is the intent: a new commit means new objects.
  LLAMA_COMMIT: f280b26983ad0fdb705a0d9ebf0503e76f2899b0
  # Image generation engine. Pinned like llama.cpp so both platforms
  # build the same code.
  SD_COMMIT: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
  # Part of the DerivedData cache key: a tree built by a different Xcode must
  # not be reused, or a preview run would poison the pinned one.
  XCODE_MAJOR: ${{ inputs.xcode || '26' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # MLX and its Metal shaders add enough compile time to both app builds that
    # 40 minutes stopped being comfortable headroom.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_MAJOR }}

      # Xcode 27 ships without the Metal toolchain, so mlx-swift's shaders fail
      # to compile with "cannot execute tool 'metal'". The component download
      # needs no Apple ID; on images that already have it this is a cheap probe.
      - name: Ensure Metal toolchain
        run: |
          if xcrun --sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi

      # ---------------------------------------------------------------- caches
      #
      # Restore and save are separate steps, rather than one actions/cache step.
      # The combined action declares `post-if: success()`, so it saves nothing
      # when a job fails — and while a workflow is being developed most runs
      # fail. A failed run therefore paid the full cold cost and persisted none
      # of it, leaving every cache empty and the next run just as slow. That was
      # measured: the first run of this workflow had all four caches miss, and
      # failed at the Swift compile, so all four were discarded.
      #
      # Splitting them lets each save run under `if: always()`, banking finished
      # work whether or not the app compiled. `continue-on-error` covers a re-run
      # of the same commit, where the key already exists and the save action
      # reports that as an error.
      #
      # Keys are unique to the runner OS, and the llama.cpp entries carry the
      # pinned commit, so a restored tree can only hold objects built from the
      # commit whose headers they were compiled against.

      # The key is computed once, here, and both the restore and the save refer
      # to this step's output.
      #
      # It must not be an inline hashFiles() expression in both places: each is
      # evaluated where it stands, so the restore hashes the workspace before the
      # build and the save hashes it after. Any file the build creates or edits
      # that matches the globs changes the second hash, the save lands under a key
      # the next run never asks for, and the entry is pure waste. That happened,
      # visibly: a run restored `macOS-gradle-be865182...` and then saved
      # `macOS-gradle-f14ceeca...`, so the cache grew by 1.4 GB per run and was
      # only ever hit through the restore-key prefix fallback.
      #
      # The explicit file list also matters. Globs like `**/*.gradle*` reach into
      # the vendored llama.cpp checkout, whose examples/llama.android tree ships
      # its own build.gradle.kts and gradle-wrapper.properties — files that exist
      # only after the llama.cpp cache is restored, so the key would depend on
      # cache state. Naming this project's own manifest files avoids both
      # problems, and the ordering below the llama.cpp restore therefore no longer
      # matters.
      - name: Compute Gradle cache key
        id: gradle-key
        run: |
          echo "key=${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'cli/build.gradle.kts', 'core/build.gradle.kts') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Gradle and Kotlin/Native
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # llama.cpp source plus both CMake trees.
      - name: Restore llama.cpp source and cmake builds
        uses: actions/cache/restore@v4
        with:
          path: |
            ci-llama
            build-ios-sim
            build-ios-dev
          key: ${{ runner.os }}-llama-${{ env.LLAMA_COMMIT }}-xcode${{ hashFiles('.github/workflows/ios.yml') }}
          restore-keys: |
            ${{ runner.os }}-llama-${{ env.LLAMA_COMMIT }}-xcode${{ hashFiles('.github/workflows/ios.yml') }}

      # Gradle: dependency cache, wrapper, and the Kotlin/Native toolchain that
      # konan downloads. The restore-key fallback (no trailing hash) keeps the
      # expensive ~/.konan toolchain reusable when only the project changes —
      # that download alone is several minutes.
      #
      # The glob must not be `**/*.gradle*`. The llama.cpp checkout contains
      # examples/llama.android/build.gradle.kts and its own
      # gradle-wrapper.properties; hashing those would make the key depend on
      # whether the llama.cpp cache had been restored, so the first run would
      # compute one key and every later run another, and the Gradle cache could
      # never hit. Rooting the patterns at this repo's own module depth avoids
      # the vendored tree entirely.

      # Xcode DerivedData for both configurations. This also carries
      # ios-app/build/SourcePackages, so Swift package resolution (MLX,
      # swift-transformers, MarkdownUI) is reused instead of being re-checked-out
      # and re-compiled every push.
      #
      # Keyed on the Swift sources and the project manifest, so an exact-key hit
      # cannot serve a stale incremental build; the restore-key fallback allows a
      # previous-commit tree so the Swift compiler rebuilds only what changed.
      # Xcode's build database records what succeeded, so a tree left by a failed
      # compile is safe to reuse: unaffected objects are kept and the broken ones
      # are redone, exactly as a local incremental build behaves.
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            ios-app/build
            ios-app/build-device
          key: ${{ runner.os }}-xcode${{ env.XCODE_MAJOR }}-deriveddata-${{ hashFiles('ios-app/PocketLLM/**/*.swift', 'ios-app/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_MAJOR }}-deriveddata-

      # Homebrew bottles/downloads for the only formula this job installs.
      - name: Restore Homebrew downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-v1-
            ${{ runner.os }}-brew-

      # ----------------------------------------------------------------- build

      - name: Build PocketLLMKit XCFramework
        run: ./gradlew :core:assemblePocketLLMKitXCFramework -PenableIos=true -PskipAndroid=true --no-daemon

      - name: Copy framework into the app
        run: |
          mkdir -p ios-app/Frameworks
          cp -R core/build/XCFrameworks/Release/PocketLLMKit.xcframework ios-app/Frameworks/

      - name: Generate Xcode project
        run: |
          # brew is a no-op when the formula is already present (cached bottles).
          brew install xcodegen
          cd ios-app && xcodegen generate

      # NOTE: Xcode 26 is required — mlx-swift-lm 3.x declares swift-tools-version 6.2.
      # is a simulator-only developer build (not a release), and hard-pinning a
      # major version eventually breaks CI when GitHub prunes runner images.
      - name: Build llama.cpp for iOS (device, arm64)
        run: |
          # Device slice of the pinned llama.cpp, with the Metal backend.
          #
          # GGML_METAL_EMBED_LIBRARY folds the shader source into the static
          # library and compiles it at runtime. That is the only workable mode
          # here: the alternative shells out to `xcrun -sdk macosx metal` (wrong
          # SDK for an iOS cross-build) and expects a default.metallib sitting in
          # the app bundle, which a libtool-merged .a cannot provide.
          # The checkout used to happen in the simulator step, which is gone:
          # the device step assumed ci-llama was already there and failed with
          # "source directory does not exist". Guarded by -d because a cache hit
          # already provides it, so this only runs on a miss.
          test -d ci-llama/.git || git clone --filter=blob:none https://github.com/ggml-org/llama.cpp ci-llama
          git -C ci-llama fetch --depth 1 origin "$LLAMA_COMMIT" || true
          git -C ci-llama checkout "$LLAMA_COMMIT" 2>/dev/null || git -C ci-llama checkout -f FETCH_HEAD
          cmake -S ci-llama -B build-ios-dev \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_MTMD=ON -DMTMD_VIDEO=OFF
          cmake --build build-ios-dev --target llama ggml ggml-base ggml-cpu ggml-metal mtmd -j3

          mkdir -p ios-app/llama-libs-device
          libtool -static -o ios-app/llama-libs-device/libpocketllm_ios.a $(find build-ios-dev -name "*.a" | sort)

          # Headers come from the same source tree as the archive, and are
          # shared with the app target through HEADER_SEARCH_PATHS. They used
          # to be copied inside the simulator step; with that step gone this is
          # the only copy, so removing it would leave the app with no llama.h.
          # The mkdir used to live in the simulator step alongside these copies;
          # dropping that step dropped it too, and set -e turned the missing
          # destination into a failed build rather than a silent skip.
          mkdir -p ios-app/llama-headers ios-app/llama-libs-device
          cp ci-llama/include/llama.h ios-app/llama-headers/
          cp ci-llama/ggml/include/*.h ios-app/llama-headers/
          # mtmd lives in tools/, not include/, and had no copy of its own -- the
          # simulator step used to carry it behind `|| true`, which would have
          # hidden its absence. No `|| true` here: a missing mtmd.h must fail the
          # build rather than surface as `file not found` inside LlamaBridge.mm.
          cp ci-llama/tools/mtmd/*.h ios-app/llama-headers/
          find build-ios-dev -name "ggml-version.h" -exec cp {} ios-app/llama-headers/ \; || true

      - name: Build stable-diffusion.cpp (device)
        run: |
          # Built as a SHARED library so sdcpp carries its vendored ggml in its
          # own Mach-O image. Statically linking it next to llama.cpp put two
          # ggml copies in one binary: only sdcpp's *extra* patched ops pulled
          # its ggml objects, so ggml_new_tensor_impl and ggml_new_object existed
          # twice. sdcpp's calls then bound to llama.cpp's unpatched ggml, the
          # tensor layout diverged and the sampler read through a bad pointer
          # (SIGSEGV mid-generation). Android is safe because sdcpp ships as
          # libsdcpp.so; this is the iOS equivalent. SD_BUILD_SHARED_GGML_LIB is
          # OFF so ggml is static *inside* that one dylib, not a second image.
          #
          # Metal is ON now: the diffusion model and VAE, which dominate the
          # runtime, run on the GPU. Two ggml-Metal copies used to abort llama at
          # context creation, so the app frees the LLM and its Metal context
          # before sdcpp builds its own (ComputeCoordinator). The hidden-visibility
          # preset keeps this dylib's ggml symbols out of the global namespace, so
          # they cannot interpose against llama.cpp's copy either.
          test -d ci-sd/.git || git clone --filter=blob:none https://github.com/leejet/stable-diffusion.cpp ci-sd
          git -C ci-sd fetch --depth 1 origin "$SD_COMMIT" || true
          git -C ci-sd checkout "$SD_COMMIT" 2>/dev/null || git -C ci-sd checkout -f FETCH_HEAD
          git -C ci-sd submodule update --init --recursive --depth 1 || true
          # One denoise step at 1024x768 is a single Metal command buffer by
          # default (n_cb = 1), and the main thread's buffer could hold most of
          # the graph's nodes, so a step ran ~8 s on an M2 and tripped the iOS
          # GPU progress watchdog (the app dies with kIOGPUCommandBufferCallback
          # ErrorInnocentVictim, not a compute error). The patch (a) raises the
          # graph split, tunable with GGML_METAL_N_CB, and (b) splits the nodes
          # evenly across the main thread and the n_cb helpers so no single
          # buffer is the long pole. It is applied to the fresh clone because SD
          # is fetched on demand rather than vendored (see build-sd.sh), and
          # ci-sd is not cached, so this runs exactly once per build.
          #
          # `patch`, not `git apply`: the target lives inside the ggml
          # submodule, and git refuses cleanly to apply against a gitlink.
          patch -p1 -d ci-sd -i "$GITHUB_WORKSPACE/ios-app/patches/stable-diffusion-metal-command-buffers.patch"
          grep -q ggml_backend_metal_preferred_n_cb ci-sd/ggml/src/ggml-metal/ggml-metal.cpp \
            || { echo "metal command-buffer patch did not apply (cpp)"; exit 1; }
          grep -q 'gf->n_nodes/(ctx->n_cb + 1)' ci-sd/ggml/src/ggml-metal/ggml-metal-context.m \
            || { echo "metal command-buffer patch did not apply (context)"; exit 1; }
          # Optional latent hand-off: with SD_LATENTS_DUMP set, decode_image_outputs
          # writes the final latents and skips the VAE decode, so the app can decode
          # them with MLX instead. The guard checks both the env read and the write.
          patch -p1 -d ci-sd -i "$GITHUB_WORKSPACE/ios-app/patches/stable-diffusion-latents-dump.patch"
          grep -q 'SD_LATENTS_DUMP' ci-sd/src/pipeline/image.cpp \
            || { echo "latents-dump patch did not apply"; exit 1; }
          cmake -S ci-sd -B build-sd-dev \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSD_BUILD_EXAMPLES=OFF -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DCMAKE_INSTALL_NAME_DIR=@rpath -DCMAKE_BUILD_WITH_INSTALL_NAME_DIR=ON \
            -DCMAKE_C_VISIBILITY_PRESET=hidden \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_METAL=ON -DSD_VULKAN=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF
          cmake --build build-sd-dev -j3
          mkdir -p ios-app/sd-libs-device ios-app/sd-headers
          SD_DYLIB=$(find build-sd-dev -name "libstable-diffusion*.dylib" | head -1)
          test -n "$SD_DYLIB" || { echo "stable-diffusion dylib was not built"; exit 1; }
          cp "$SD_DYLIB" ios-app/sd-libs-device/libsdcpp_ios.dylib
          # The app records this id in its load command; without it the binary
          # would look for the CI build path at launch and fail to dlopen.
          install_name_tool -id @rpath/libsdcpp_ios.dylib ios-app/sd-libs-device/libsdcpp_ios.dylib
          cp ci-sd/include/*.h ios-app/sd-headers/ 2>/dev/null || true
          cp ci-sd/ggml/include/*.h ios-app/sd-headers/ 2>/dev/null || true


      - name: Build iOS app (device, unsigned)
        run: |
          cd ios-app
          # Unsigned on purpose: free-Apple-ID re-signing (Sideloadly/AltStore)
          # rejects binaries carrying a different signature, and CI has no
          # signing identity. LIBRARY_SEARCH_PATHS overrides the project value
          # so the linker picks the device .a instead of the simulator one.
          xcodebuild -project PocketLLM.xcodeproj -scheme PocketLLM \
            -destination "generic/platform=iOS" \
            -configuration Release -derivedDataPath build-device \
            build CODE_SIGNING_ALLOWED=NO \
            LIBRARY_SEARCH_PATHS="\$(SRCROOT)/llama-libs-device \$(SRCROOT)/sd-libs-device"

      - name: Package unsigned .ipa
        run: |
          cd ios-app/build-device/Build/Products/Release-iphoneos
          # The sdcpp dylib carries its own ggml and is loaded from
          # @executable_path/Frameworks (the app's rpath). No "Embed Frameworks"
          # build phase exists for it because it is produced outside Xcode, so
          # copy it in here, before the bundle is zipped.
          mkdir -p PocketLLM.app/Frameworks
          cp "$GITHUB_WORKSPACE/ios-app/sd-libs-device/libsdcpp_ios.dylib" PocketLLM.app/Frameworks/
          rm -rf Payload
          mkdir Payload && cp -R PocketLLM.app Payload/
          zip -qry PocketLLM-unsigned.ipa Payload

      - name: Verify ggml symbols are not duplicated and sdcpp is embedded
        run: |
          # build-device, not build: the device app is built with
          # -derivedDataPath build-device, while build belonged to the simulator
          # slice that no longer exists. Searching build inspected a stale cached
          # bundle and reported zero symbols, so this could never catch anything.
          APP=$(find ios-app/build-device -name 'PocketLLM.app' -type d | head -1)
          test -n "$APP" || { echo "no device .app found"; exit 1; }
          case "$APP" in
            *-iphoneos*) ;;
            *) echo "refusing: $APP is not an iphoneos bundle"; exit 1 ;;
          esac
          # sdcpp must be inside the bundle as a dylib, not linked into the app.
          test -f "$APP/Frameworks/libsdcpp_ios.dylib" || {
            echo "$APP/Frameworks/libsdcpp_ios.dylib is missing"; exit 1; }
          BIN="$APP/PocketLLM"
          test -f "$BIN" || { echo "no binary at $BIN"; exit 1; }

          NM=$(xcrun -f llvm-nm)
          # Now that sdcpp is a separate image its ggml cannot collide with
          # llama.cpp's, so any duplicate here means the dylib was linked back
          # into the app and the crash has been reintroduced.
          DEFS=$("$NM" "$BIN" | awk '($2 == "T" || $2 == "t") {print $3}' | grep -c '^_ggml_' || true)
          DUP=$("$NM" "$BIN" | awk '($2 == "T" || $2 == "t") {print $3}' | grep '^_ggml_' | sort | uniq -d || true)
          echo "ggml definitions in app binary: $DEFS"
          if [ -n "$DUP" ]; then
            echo "ERROR: duplicate ggml symbols are back — sdcpp is no longer"
            echo "isolated in its own image. sdcpp's calls would bind to"
            echo "llama.cpp's ggml again and corrupt tensors:"
            echo "$DUP" | sed 's/^/  /'
            exit 1
          fi
          echo "sdcpp isolated; no duplicate ggml symbols in the app binary"
          # The dylib must define its own ggml.
          "$NM" "$APP/Frameworks/libsdcpp_ios.dylib" | grep -q '^.*_ggml_new_tensor_impl' \
            && echo "sdcpp dylib carries its own ggml" \
            || { echo "sdcpp dylib does not define ggml"; exit 1; }

          SD="$APP/Frameworks/libsdcpp_ios.dylib"
          # SD_METAL must actually be compiled in, or the GPU hand-off is moot.
          "$NM" "$SD" | grep -q 'ggml_backend_metal' \
            && echo "sdcpp dylib has the Metal backend" \
            || { echo "sdcpp dylib has no Metal backend — SD_METAL did not take"; exit 1; }
          # The SD API must stay exported for the app to link against it.
          "$NM" -gU "$SD" | grep -q '_new_sd_ctx' \
            && echo "sdcpp dylib exports the SD API" \
            || { echo "sdcpp dylib does not export new_sd_ctx"; exit 1; }
          # ggml must be local (hidden): an exported copy could interpose on
          # llama.cpp's in the executable and reintroduce the tensor corruption.
          # The two ggml_metallib_* data markers are generated by the embed step
          # with default visibility and are expected to stay global — they are
          # shader-source pointers, not the code symbols whose duplication broke
          # generation. Everything else under _ggml_ must be local.
          EXPORTED=$("$NM" -gU "$SD" | grep '_ggml_' | grep -v '_ggml_metallib_' || true)
          if [ -n "$EXPORTED" ]; then
            echo "ERROR: sdcpp dylib exports ggml symbols — hidden visibility did not hold"
            echo "$EXPORTED" | head -10 | sed 's/^/  /'
            exit 1
          fi
          echo "sdcpp ggml symbols are local (apart from the metallib markers)"

      - name: Upload device .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLM-device-unsigned
          path: ios-app/build-device/Build/Products/Release-iphoneos/PocketLLM-unsigned.ipa
          if-no-files-found: error

      # ------------------------------------------------------------------ save
      # Always: that is the whole point of splitting restore from save above.
      # Everything here is finished work the next run should not repeat, whether
      # or not the app compiled.

      - name: Save llama.cpp source and cmake builds
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ci-llama
            build-ios-sim
            build-ios-dev
          key: ${{ runner.os }}-llama-${{ env.LLAMA_COMMIT }}-xcode${{ hashFiles('.github/workflows/ios.yml') }}

      - name: Save Gradle and Kotlin/Native
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ steps.gradle-key.outputs.key }}

      - name: Save Xcode DerivedData
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ios-app/build
            ios-app/build-device
          key: ${{ runner.os }}-xcode${{ env.XCODE_MAJOR }}-deriveddata-${{ hashFiles('ios-app/PocketLLM/**/*.swift', 'ios-app/project.yml') }}

      - name: Save Homebrew downloads
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1-${{ github.run_id }}
