name: android-prerelease

# Builds one APK per ABI and attaches them to a GitHub pre-release.
#
# Each ABI is a SEPARATE matrix job with its own runner workspace. Building both
# in one job is what previously shipped two byte-identical APKs: every gradle
# build overwrites app-release-unsigned.apk, so the second ABI clobbered the
# first and both signed files were the same x86_64-only package - which then
# failed with an incompatible-ABI error when installed on arm64.
#
# x86_64 ships without the Python sandbox: libproot/libtalloc/libandroid-shmem
# are arm64-only prebuilts with no source in-tree, and the bundled Alpine rootfs
# is aarch64. Everything else (LLM, image generation, memory, voice, MCP) works.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-pre*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.prefix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SEALED - arm64 no longer runs on CI. The arm64 APK is built locally
          # (build-native.sh + build-sd.sh in the dev container) instead; CI kept
          # producing a package that failed on device. Commented rather than
          # deleted so this can be re-enabled if the runner is ever fixed.
          # - abi: arm64-v8a
          #   prefix: arm64
          - abi: x86_64
            prefix: x86_64
    env:
      APK_NAME: pocketllm-v0.6.0-beta
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK and cmdline-tools. The
      # android-actions/setup-android action is deliberately not used: it tries
      # to install the long-removed 'tools' package and dies with
      # "Failed to find package 'tools'".
      - name: Install NDK and CMake
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # arm64 keeps the Vulkan backend, and ggml-vulkan needs glslc, the C++
      # Vulkan bindings and the SPIR-V headers - none of which the NDK ships.
      - name: Install Vulkan tooling
        if: matrix.abi == 'arm64-v8a'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc libvulkan-dev spirv-headers || \
            sudo apt-get install -y shaderc libvulkan-dev spirv-headers
          ls /usr/include/vulkan/vulkan.hpp /usr/include/spirv/unified1/spirv.hpp

      - name: Fetch stable-diffusion.cpp
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/leejet/stable-diffusion.cpp third_party/sd

      # app/src/main/cpp/llama.cpp is gitignored - it is a nested clone of
      # roughly 200MB, so it is not in the repository and must be fetched here.
      - name: Fetch llama.cpp
        run: |
          git init app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C app/src/main/cpp/llama.cpp fetch --depth 1 origin f280b26983ad0fdb705a0d9ebf0503e76f2899b0
          git -C app/src/main/cpp/llama.cpp checkout FETCH_HEAD

      - name: Build native
        env:
          POCKETLLM_ABI: ${{ matrix.abi }}
          POCKETLLM_BUILD_JOBS: 4
        run: |
          export ANDROID_NDK="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          export POCKETLLM_TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          ./build-native.sh
          ./build-sd.sh

      - name: Build and sign APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PpocketllmAbi=${{ matrix.abi }}
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          src="app/build/outputs/apk/release/app-release-unsigned.apk"
          echo "--- native libs in $src:"
          unzip -l "$src" | grep "lib/" || true
          # A clobbered or wrong-ABI output signs fine and only fails on the
          # user's device, so assert the contents before shipping.
          unzip -l "$src" | grep -q "lib/${{ matrix.abi }}/libpocketllm.so" \
            || { echo "ABORT: $src lacks lib/${{ matrix.abi }}/libpocketllm.so"; exit 1; }
          for other in arm64-v8a x86_64 armeabi-v7a x86; do
            [ "$other" = "${{ matrix.abi }}" ] && continue
            unzip -l "$src" | grep -q "lib/$other/" \
              && { echo "ABORT: $src also contains lib/$other/"; exit 1; }
          done
          out="${{ matrix.prefix }}-$APK_NAME.apk"
          "$BT/apksigner" sign \
            --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "$out" "$src"
          "$BT/apksigner" verify "$out"
          sha256sum "$out" | tee "$out.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.prefix }}
          path: |
            ${{ matrix.prefix }}-pocketllm-v0.6.0-beta.apk
            ${{ matrix.prefix }}-pocketllm-v0.6.0-beta.apk.sha256
          if-no-files-found: error

  release:
    name: create pre-release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la *.apk *.sha256
          # When both ABIs are built here they must genuinely differ. arm64 is
          # currently sealed (built locally), so only compare if both exist.
          af=$(ls arm64-*.apk 2>/dev/null | head -1 || true)
          xf=$(ls x86_64-*.apk 2>/dev/null | head -1 || true)
          if [ -n "$af" ] && [ -n "$xf" ]; then
            a=$(sha256sum "$af" | cut -d' ' -f1)
            b=$(sha256sum "$xf" | cut -d' ' -f1)
            [ "$a" != "$b" ] || { echo "ABORT: arm64 and x86_64 APKs are identical"; exit 1; }
          fi
          TAG="prerelease-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" *.apk *.sha256 \
            --prerelease --title "PocketLLM pre-release $TAG" \
            --notes "Separate arm64 and x86_64 APKs. x86_64 has no Python sandbox (arm64-only proot prebuilts)." \
            --latest=false
