name: xcode-probe

# Temporary: reports which Xcodes the macos-26 image ships and whether Xcode 27
# can be installed without Apple ID credentials. Delete after reading.
on:
  push:
    paths:
      - ".github/workflows/xcode-probe.yml"
  workflow_dispatch:

jobs:
  macos26:
    runs-on: macos-26
    steps:
      - name: Host
        run: sw_vers; uname -m
      - name: Toolchain
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          ls "$SDK/System/Library/Frameworks" | grep -i -E '^CoreAI' || echo "no CoreAI.framework"
      - name: Swift import probe
        run: |
          cat > /tmp/t.swift <<'SWIFT'
          #if canImport(CoreAI)
          import CoreAI
          print("CoreAI: importable")
          #else
          print("CoreAI: absent")
          #endif
          SWIFT
          swift /tmp/t.swift

  xcode27:
    runs-on: xcode-27
    steps:
      - name: Host
        run: sw_vers; uname -m
      - name: Toolchain
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          ls "$SDK/System/Library/Frameworks" | grep -i -E '^CoreAI' || echo "no CoreAI.framework"
      - name: Swift import probe
        run: |
          cat > /tmp/t.swift <<'SWIFT'
          #if canImport(CoreAI)
          import CoreAI
          print("CoreAI: importable")
          #else
          print("CoreAI: absent")
          #endif
          SWIFT
          swift /tmp/t.swift
      - name: CoreAI availability
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F="$SDK/System/Library/Frameworks/CoreAI.framework/CoreAI.tbd"
          ls -la "$F" 2>/dev/null || true
          grep -m5 -i "ios" "$F" 2>/dev/null | head -10 || true
