name: "PocketLLM CodeQL"

# Whitelist first-party source. A blacklist (paths-ignore) kept over-matching
# and dropping the Kotlin/C++ source, which made those jobs fail with
# "detected code written in X but could not process any of it".
paths:
  - app/src
  - core/src
  - cli/src
  - ios-app
  - scripts
  - .github
  - stress-test

queries:
  - uses: security-extended
