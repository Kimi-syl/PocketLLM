name: "PocketLLM CodeQL"

# Vendored/generated trees are excluded so results stay about our code.
# Without this the scanner reports on SPIR-V and OpenCL headers, which is how
# default setup picked "python" and "csharp" as the repo languages.
paths-ignore:
  - vulkan-host/**
  - opencl-host/**
  - third_party/**
  - build-native/**
  - build-native-desktop/**
  - app/src/main/cpp/llama.cpp/**
  - "**/build/**"
  - "**/node_modules/**"

queries:
  - uses: security-extended
